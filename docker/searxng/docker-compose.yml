# Self-contained local SearXNG for websearch-skill.
#
# One container, nothing installed on the host, nothing written into the repo.
# The JSON API is on, the bot limiter is off (this instance is private and only
# your own tool talks to it), and the secret key comes from a generated .env
# rather than being committed here.
#
# Use ./searxng.sh instead of driving compose by hand:
#   ./docker/searxng/searxng.sh up        # generate secret, start, wait for health
#   ./docker/searxng/searxng.sh status    # health + engine counts + a live query
#   ./docker/searxng/searxng.sh down      # stop and remove
#
# Upstream reference: https://docs.searxng.org/admin/installation-docker.html

name: websearch-searxng

services:
  searxng:
    container_name: websearch-searxng
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: unless-stopped
    ports:
      # Loopback only by default. Set SEARXNG_HOST=0.0.0.0 in .env to expose it on
      # your LAN, and read "Before exposing it" in README.md first.
      - "${SEARXNG_HOST:-127.0.0.1}:${SEARXNG_PORT:-8888}:8080"
    volumes:
      # .runtime/settings.yml is rendered from the tracked core-config/settings.yml by
      # searxng.sh on every up/restart; it is the only copy that may hold an egress
      # proxy URL, which is why it is gitignored and mode 0600. Mounted read-only, so
      # the container cannot rewrite its own settings. FORCE_OWNERSHIP=false below
      # stops the entrypoint from trying to chown a read-only mount.
      - ./.runtime/:/etc/searxng/:ro
      # Runtime cache (favicons, engine state) lives in a Docker-managed volume,
      # not in the repo working tree. `searxng.sh down --purge` removes it.
      - searxng-cache:/var/cache/searxng
    environment:
      - FORCE_OWNERSHIP=false
      - SEARXNG_BASE_URL=http://localhost:${SEARXNG_PORT:-8888}/
      # No default on purpose: an unset secret must fail loudly, never fall back
      # to a shared placeholder. ./searxng.sh up writes one into .env.
      - SEARXNG_SECRET=${SEARXNG_SECRET:?run ./docker/searxng/searxng.sh up (it generates .env)}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # wget ships in the image; curl does not.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  searxng-cache:
