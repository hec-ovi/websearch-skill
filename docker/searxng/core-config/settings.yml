# Overrides layered on top of SearXNG's shipped defaults.
# Full reference: https://docs.searxng.org/admin/settings/index.html
#
# `use_default_settings: true` pulls in the complete default engine list, so only the
# deltas live here. The engine block at the bottom is generated: see
# ./docker/searxng/searxng.sh engines.
use_default_settings: true

server:
  # secret_key comes from the SEARXNG_SECRET env var (docker-compose.yml reads it from
  # .env, which searxng.sh generates per machine). Nothing secret is committed here.
  #
  # This instance is private and only your tool queries it, so the bot limiter (which
  # would 429 an automated client) stays off. Turn it on, add a valkey service, and set
  # public_instance: true only for a public box.
  limiter: false
  public_instance: false

search:
  # SearXNG ships HTML only; the tool reads the JSON API, so enable it here.
  # Without this, /search?format=json returns HTTP 403.
  formats:
    - html
    - json

outgoing:
  # searxng.sh replaces the marker line below with an `outgoing.proxies` entry when an
  # egress proxy is configured, writing the result to the gitignored
  # .runtime/settings.yml. The URL carries credentials, so it is rendered at start time
  # and never committed. See tools/render-settings.py.
  # >>> PROXY MARKER <<<
  #
  # The generated block below puts ~50 engines in the general fanout instead of the
  # stock handful, so the defaults (pool_maxsize 20) would queue connections and the
  # slowest engines would decide the response time.
  pool_connections: 300
  pool_maxsize: 100
  request_timeout: 3.0
  # Hard ceiling per engine. Engines may declare their own timeout and some ask for
  # 10s; the search client gives up at 8s, and losing every result to one slow engine
  # is a worse trade than losing that engine. Measured: ~30 engines answer within it.
  max_request_timeout: 5.0

